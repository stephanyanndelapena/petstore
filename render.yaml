# Render manifest for petstore
# Deploys a Postgres database, the Java backend, and the React frontend

databases:
  - name: petstore-db
    postgresMajorVersion: "15"
    plan: free

services:
  - type: web
    name: petstore-backend
    runtime: docker
    region: oregon
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: ALLOWED_ORIGINS
        value: https://petstore-frontend-cpmu.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: petstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: petstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: petstore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: petstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password
    plan: free


  - type: web
    name: petstore-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://petstore-backend-erzd.onrender.com/delapena/v1
