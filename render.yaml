# Render manifest for petstore
# Deploys a Postgres database, the Java backend, and the React frontend

databases:
  - name: petstore-db
    postgresMajorVersion: "15"
    plan: starter

services:
  - type: web
    name: petstore-backend
    runtime: docker
    region: oregon
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
    plan: starter

  - type: web
    name: petstore-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: starter
