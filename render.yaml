# Render manifest for petstore
# Deploys a Postgres database, the Java backend, and the React frontend

databases:
  - name: petstore-db
    postgresMajorVersion: "15"
    plan: starter

services:
  - type: web
    name: petstore-backend
    env: java
    region: oregon
    buildCommand: mvn -f backend -DskipTests package
    startCommand: java -jar backend/target/petstore-backend-0.1.0-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
    plan: starter

  - type: web
    name: petstore-frontend
    runtime: static
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: starter
