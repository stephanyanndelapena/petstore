spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/petstore}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# Disable Flyway by default to allow automatic schema creation via JPA for quick dev runs.
flyway:
  enabled: true
  locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
