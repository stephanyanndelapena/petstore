spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/petstore}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

flyway:
  enabled: true
  locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
